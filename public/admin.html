<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Print Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0}.wrap{max-width:1000px;margin:25px auto;padding:15px}
.card{background:#fff;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 3px 18px #0001}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.file{padding:10px;background:#f5f5f5;border-radius:8px;margin:7px 0}
button,a{padding:9px 12px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}a{background:#111;color:white}.del{background:#d33;color:#fff}.refresh{background:#ddd}
input{padding:10px;width:280px;max-width:100%;box-sizing:border-box}
</style></head><body><div class="wrap">
<h1>🖨️ Café Print Dashboard</h1>
<div class="card"><input id="key" type="password" placeholder="Admin key"><button class="refresh" onclick="load()">Login / Refresh</button><span id="status"></span></div>
<div id="jobs"></div>
</div>
<script>
let KEY=localStorage.cafeKey||"";
key.value=KEY;
async function load(){
 KEY=key.value; localStorage.cafeKey=KEY;
 const r=await fetch("/api/jobs",{headers:{"x-admin-key":KEY}});
 if(!r.ok){status.textContent=" ❌ गलत key"; jobs.innerHTML=""; return;}
 status.textContent=" ✅ Connected";
 const data=await r.json(); jobs.innerHTML="";
 if(!data.length){jobs.innerHTML="<div class='card'>कोई नया document नहीं है.</div>";return;}
 for(const j of data){
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<div class="row"><div><b>${esc(j.name)}</b> · ****${esc(j.last4)}<br><small>${new Date(j.createdAt).toLocaleString()}</small></div><button class="del" onclick="del('${j.id}')">Delete All</button></div>`;
  for(const f of j.files){
   const d=document.createElement("div"); d.className="file";
   d.innerHTML=`${esc(f.originalName)} <a href="/api/file/${f.id}?key=${encodeURIComponent(KEY)}">Download / Print</a>`;
   c.appendChild(d);
  }
  jobs.appendChild(c);
 }
}
async function del(id){if(!confirm("इस customer की सभी files delete करें?"))return; await fetch("/api/job/"+id,{method:"DELETE",headers:{"x-admin-key":KEY}});load();}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
</script></body></html>
