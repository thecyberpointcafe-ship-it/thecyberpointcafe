<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shad Sheikh Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px 15px 40px;
}

h1{
  text-align:center;
  margin:15px 0 25px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 25px #00000012;
}

.login{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:15px;
}

button,a{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  font-weight:bold;
}

button{
  background:#1264d8;
  color:white;
}

.home{
  display:inline-block;
  background:#172033;
  color:white;
}

.delete{
  background:#d33;
  color:white;
  margin-top:15px;
}

.open{
  background:#1264d8;
  color:white;
  margin:5px 5px 5px 0;
}

.copy{
  background:#168a45;
  color:white;
  margin:5px 5px 5px 0;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.file{
  background:#f5f7fa;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.file-name{
  font-weight:bold;
  word-break:break-word;
}

.small{
  color:#667085;
  font-size:14px;
  margin-top:5px;
}

.preview{
  width:100%;
  max-width:500px;
  max-height:500px;
  object-fit:contain;
  display:block;
  margin:12px 0;
  border-radius:10px;
  border:1px solid #ddd;
  background:white;
}

.pdf-preview{
  width:100%;
  height:600px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:12px;
}

.loading{
  padding:12px;
  text-align:center;
  color:#667085;
}

@media(max-width:600px){

  .login{
    display:block;
  }

  .login input,
  .login button{
    width:100%;
    margin-bottom:10px;
  }

  .pdf-preview{
    height:500px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<a class="home" href="/">
← Public Website
</a>

<h1>🔐 Shad Sheikh Admin</h1>

<div class="card">

<div class="login">

<input
id="key"
type="password"
placeholder="Admin password">

<button onclick="loadJobs()">
Login / Refresh
</button>

</div>

<div id="status" class="status">
Password enter karke Login karein.
</div>

</div>

<div id="jobs"></div>

</div>


<script>

const keyInput =
document.getElementById("key");

const statusBox =
document.getElementById("status");

const jobsBox =
document.getElementById("jobs");

const fileCache =
new Map();


keyInput.value =
localStorage.getItem("cafeAdminKey") || "";


/* =========================
   LOAD DOCUMENTS
========================= */

async function loadJobs(){

const key =
keyInput.value.trim();

if(!key){

statusBox.textContent =
"❌ Password enter karein.";

return;
}

localStorage.setItem(
"cafeAdminKey",
key
);

statusBox.textContent =
"⏳ Documents loading...";

try{

const response =
await fetch("/api/jobs",{
headers:{
"x-admin-key":key
}
});

if(!response.ok){

statusBox.textContent =
"❌ Wrong admin password.";

jobsBox.innerHTML="";

return;
}

const jobs =
await response.json();

statusBox.textContent =
"✅ Admin connected";

jobsBox.innerHTML="";


if(!jobs.length){

jobsBox.innerHTML=
'<div class="card">📭 अभी कोई document नहीं आया है.</div>';

return;
}


jobs.forEach(job=>{

const card =
document.createElement("div");

card.className="card";

const date =
new Date(job.createdAt)
.toLocaleString("en-IN");

let filesHTML="";


job.files.forEach(file=>{

const ext =
file.originalName
.split(".")
.pop()
.toLowerCase();

const isImage =
["jpg","jpeg","png","webp"]
.includes(ext);

const isPDF =
ext==="pdf";


let preview="";


if(isImage){

preview=`

<div
id="preview-${file.id}"
class="loading">

Image loading...

</div>

`;

}


if(isPDF){

preview=`

<div
id="preview-${file.id}"
class="loading">

PDF loading...

</div>

`;

}


if(!isImage && !isPDF){

preview=`

<div class="small">
📄 Word document
</div>

`;

}


filesHTML +=`

<div class="file">

<div class="file-name">
📄 ${escapeHTML(file.originalName)}
</div>

<div class="small">
Size: ${formatBytes(file.size)}
</div>

${preview}

<button
class="open"
onclick="openFile('${file.id}','${ext}')">

👁️ Open

</button>

${isImage ? `

<button
class="copy"
onclick="copyImage('${file.id}')">

📋 Copy Image

</button>

` : ""}

</div>

`;

});


card.innerHTML=`

<h3>📄 New Document</h3>

<div class="small">
Uploaded: ${date}
</div>

<hr>

${filesHTML}

<button
class="delete"
onclick="deleteJob('${job.id}')">

🗑️ Delete

</button>

`;

jobsBox.appendChild(card);


/* LOAD IMAGE/PDF PREVIEWS */

job.files.forEach(file=>{

const ext =
file.originalName
.split(".")
.pop()
.toLowerCase();

if(
["jpg","jpeg","png","webp","pdf"]
.includes(ext)
){

loadPreview(
file.id,
ext
);

}

});

});

}catch(error){

statusBox.textContent =
"❌ Server connection error.";

}

}


/* =========================
   LOAD FILE ONCE
========================= */

async function getFile(id){

if(fileCache.has(id)){

return fileCache.get(id);

}

const key =
keyInput.value.trim();

const response =
await fetch(
"/api/file/"+id,
{
headers:{
"x-admin-key":key
}
}
);

if(!response.ok){

throw new Error(
"File load failed"
);

}

const blob =
await response.blob();

const url =
URL.createObjectURL(blob);

const data={
blob:blob,
url:url
};

fileCache.set(
id,
data
);

return data;

}


/* =========================
   PREVIEW
========================= */

async function loadPreview(id,ext){

try{

const data =
await getFile(id);

const box =
document.getElementById(
"preview-"+id
);

if(!box) return;


if(
["jpg","jpeg","png","webp"]
.includes(ext)
){

const img =
document.createElement("img");

img.className="preview";

img.src =
data.url;

img.alt =
"Document Preview";

box.replaceWith(img);

}


if(ext==="pdf"){

const iframe =
document.createElement("iframe");

iframe.className=
"pdf-preview";

iframe.src =
data.url;

box.replaceWith(iframe);

}

}catch(error){

const box =
document.getElementById(
"preview-"+id
);

if(box){

box.textContent =
"❌ Document load नहीं हुआ.";

}

}

}


/* =========================
   OPEN FILE
========================= */

async function openFile(id,ext){

try{

const data =
await getFile(id);


/* IMAGE / PDF */

if(
["jpg","jpeg","png","webp","pdf"]
.includes(ext)
){

window.open(
data.url,
"_blank"
);

return;

}


/* DOC / DOCX */

const a =
document.createElement("a");

a.href =
data.url;

a.download="";

a.target="_blank";

document.body.appendChild(a);

a.click();

a.remove();

}catch(error){

alert(
"❌ Document open नहीं हुआ."
);

}

}


/* =========================
   COPY IMAGE
========================= */

async function copyImage(id){

try{

const data =
await getFile(id);

const blob =
data.blob;


if(!blob.type.startsWith("image/")){

alert(
"❌ यह image file नहीं है."
);

return;
}


if(
!navigator.clipboard ||
!window.ClipboardItem
){

alert(
"❌ Browser Copy Image support नहीं करता."
);

return;
}


await navigator.clipboard.write([

new ClipboardItem({
[blob.type]:blob
})

]);


alert(
"✅ Image copied! Photoshop में Ctrl + V करें."
);

}catch(error){

alert(
"❌ Image copy नहीं हो पाई."
);

}

}


/* =========================
   DELETE
========================= */

async function deleteJob(id){

if(
!confirm(
"क्या यह पूरा document delete करना है?"
)
){

return;
}

const key =
keyInput.value.trim();

try{

const response =
await fetch(
"/api/job/"+id,
{
method:"DELETE",
headers:{
"x-admin-key":key
}
}
);

if(!response.ok){

alert(
"❌ Delete नहीं हुआ."
);

return;
}


/* CLEAR CACHE */

fileCache.forEach(
item=>{
URL.revokeObjectURL(
item.url
);
}
);

fileCache.clear();

loadJobs();

}catch(error){

alert(
"❌ Delete error."
);

}

}


/* =========================
   FILE SIZE
========================= */

function formatBytes(bytes){

if(!bytes){
return "0 Bytes";
}

const units=[
"Bytes",
"KB",
"MB",
"GB"
];

const i=
Math.floor(
Math.log(bytes)/
Math.log(1024)
);

return(
parseFloat(
(
bytes/
Math.pow(1024,i)
).toFixed(2)
)
+" "+
units[i]
);

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
