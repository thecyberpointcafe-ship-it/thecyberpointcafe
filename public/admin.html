<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shad Sheikh Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:25px 15px 40px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 25px #00000012;
}

.login{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:220px;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:15px;
}

button,
a{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  font-weight:bold;
}

button{
  background:#1264d8;
  color:white;
}

.home{
  display:inline-block;
  background:#172033;
  color:white;
  margin-bottom:15px;
}

.delete{
  background:#d33;
  color:white;
  margin-top:15px;
}

.open{
  background:#1264d8;
  color:white;
  display:inline-block;
  margin:5px 5px 5px 0;
}

.copy{
  background:#168a45;
  color:white;
  margin:5px 5px 5px 0;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.file{
  background:#f5f7fa;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.small{
  color:#667085;
  font-size:14px;
  margin:5px 0;
}

.preview{
  width:100%;
  max-width:500px;
  max-height:500px;
  object-fit:contain;
  display:block;
  margin:12px 0;
  border-radius:10px;
  background:#fff;
  border:1px solid #ddd;
}

.pdf-preview{
  width:100%;
  height:600px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:12px;
  background:white;
}

.file-name{
  font-weight:bold;
  word-break:break-word;
}

@media(max-width:600px){

  .login{
    display:block;
  }

  .login input,
  .login button{
    width:100%;
    margin-bottom:10px;
  }

  .pdf-preview{
    height:450px;
  }

}

</style>

</head>

<body>

<div class="wrap">

<a class="home" href="/">
  ← Public Website
</a>

<h1>🔐 Shad Sheikh Admin</h1>

<div class="card">

  <div class="login">

    <input
      id="key"
      type="password"
      placeholder="Admin password"
    >

    <button onclick="loadJobs()">
      Login / Refresh
    </button>

  </div>

  <div id="status" class="status">
    Password enter karke Login karein.
  </div>

</div>

<div id="jobs"></div>

</div>


<script>

const keyInput =
  document.getElementById("key");

const statusBox =
  document.getElementById("status");

const jobsBox =
  document.getElementById("jobs");


keyInput.value =
  localStorage.getItem("cafeAdminKey") || "";


/* =========================
   LOAD DOCUMENTS
========================= */

async function loadJobs(){

  const key =
    keyInput.value.trim();

  if(!key){

    statusBox.textContent =
      "❌ Password enter karein.";

    return;
  }

  localStorage.setItem(
    "cafeAdminKey",
    key
  );

  statusBox.textContent =
    "⏳ Documents loading...";

  try{

    const response =
      await fetch("/api/jobs",{

        headers:{
          "x-admin-key":key
        }

      });


    if(!response.ok){

      statusBox.textContent =
        "❌ Wrong admin password.";

      jobsBox.innerHTML = "";

      return;
    }


    const jobs =
      await response.json();


    statusBox.textContent =
      "✅ Admin connected";


    jobsBox.innerHTML = "";


    if(!jobs.length){

      jobsBox.innerHTML =
        '<div class="card">📭 अभी कोई document नहीं आया है.</div>';

      return;
    }


    jobs.forEach(job => {

      const card =
        document.createElement("div");

      card.className =
        "card";


      const date =
        new Date(job.createdAt)
        .toLocaleString("en-IN");


      let filesHTML = "";


      job.files.forEach(file => {

        const ext =
          file.originalName
          .split(".")
          .pop()
          .toLowerCase();


        const isImage =
          ["jpg","jpeg","png","webp"]
          .includes(ext);


        const isPDF =
          ext === "pdf";


        const fileURL =
          "/api/file/" + file.id;


        let previewHTML = "";


        /* IMAGE PREVIEW */

        if(isImage){

          previewHTML = `

            <img
              class="preview"
              src="${fileURL}"
              data-file-id="${file.id}"
              alt="Document Preview"
              onerror="this.style.display='none'"
            >

            <button
              class="copy"
              onclick="copyImage('${file.id}')"
            >
              📋 Copy Image
            </button>

          `;

        }


        /* PDF PREVIEW */

        if(isPDF){

          previewHTML = `

            <iframe
              class="pdf-preview"
              src="${fileURL}"
            ></iframe>

          `;

        }


        filesHTML += `

          <div class="file">

            <div class="file-name">
              📄 ${escapeHTML(file.originalName)}
            </div>

            <div class="small">
              Size: ${formatBytes(file.size)}
            </div>

            ${previewHTML}

            <a
              class="open"
              href="${fileURL}"
              target="_blank"
            >
              👁️ Open
            </a>

          </div>

        `;

      });


      card.innerHTML = `

        <h3>
          📄 New Document
        </h3>

        <div class="small">
          Uploaded: ${date}
        </div>

        <hr>

        ${filesHTML}

        <button
          class="delete"
          onclick="deleteJob('${job.id}')"
        >
          🗑️ Delete
        </button>

      `;


      jobsBox.appendChild(card);

    });


  }catch(error){

    statusBox.textContent =
      "❌ Server connection error.";

  }

}


/* =========================
   COPY IMAGE
========================= */

async function copyImage(id){

  const key =
    keyInput.value.trim();


  try{

    const response =
      await fetch(
        "/api/file/" + id,
        {
          headers:{
            "x-admin-key":key
          }
        }
      );


    if(!response.ok){

      alert(
        "❌ Image load नहीं हो पाई."
      );

      return;
    }


    const blob =
      await response.blob();


    if(!blob.type.startsWith("image/")){

      alert(
        "❌ यह image file नहीं है."
      );

      return;
    }


    if(
      !navigator.clipboard ||
      !window.ClipboardItem
    ){

      alert(
        "❌ Browser में Copy Image support नहीं है."
      );

      return;
    }


    const item =
      new ClipboardItem({
        [blob.type]: blob
      });


    await navigator.clipboard.write([
      item
    ]);


    alert(
      "✅ Image copy हो गई! अब Photoshop में Ctrl + V करें."
    );


  }catch(error){

    alert(
      "❌ Image copy नहीं हो पाई."
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteJob(id){

  if(
    !confirm(
      "क्या यह पूरा document delete करना है?"
    )
  ){

    return;
  }


  const key =
    keyInput.value.trim();


  try{

    const response =
      await fetch(
        "/api/job/" + id,
        {
          method:"DELETE",

          headers:{
            "x-admin-key":key
          }
        }
      );


    if(!response.ok){

      alert(
        "❌ Delete नहीं हुआ."
      );

      return;
    }


    loadJobs();


  }catch(error){

    alert(
      "❌ Delete error."
    );

  }

}


/* =========================
   FILE SIZE
========================= */

function formatBytes(bytes){

  if(!bytes){
    return "0 Bytes";
  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    parseFloat(
      (bytes /
      Math.pow(1024,i))
      .toFixed(2)
    )
    + " "
    + units[i]
  );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
