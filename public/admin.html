<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shad Sheikh Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:25px 15px 40px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 25px #00000012;
}

.login{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:220px;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:15px;
}

button,a{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  font-weight:bold;
}

button{
  background:#1264d8;
  color:white;
}

.home{
  display:inline-block;
  background:#172033;
  color:white;
  margin-bottom:15px;
}

.delete{
  background:#d33;
  color:white;
}

.download{
  background:#1264d8;
  color:white;
  display:inline-block;
  margin:5px 5px 5px 0;
}

.status{
  margin-top:12px;
  font-weight:bold;
}

.file{
  background:#f5f7fa;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}

.small{
  color:#667085;
  font-size:14px;
}

@media(max-width:600px){
  .login{
    display:block;
  }

  .login input,
  .login button{
    width:100%;
    margin-bottom:10px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<a class="home" href="/">← Public Website</a>

<h1>🔐 Shad Sheikh Admin</h1>

<div class="card">

  <div class="login">

    <input
      id="key"
      type="password"
      placeholder="Admin password"
    >

    <button onclick="loadJobs()">
      Login / Refresh
    </button>

  </div>

  <div id="status" class="status">
    Password enter karke Login karein.
  </div>

</div>

<div id="jobs"></div>

</div>

<script>

const keyInput = document.getElementById("key");
const statusBox = document.getElementById("status");
const jobsBox = document.getElementById("jobs");

keyInput.value = localStorage.getItem("cafeAdminKey") || "";

async function loadJobs(){

  const key = keyInput.value.trim();

  if(!key){
    statusBox.textContent = "❌ Password enter karein.";
    return;
  }

  localStorage.setItem("cafeAdminKey", key);

  statusBox.textContent = "⏳ Loading...";

  try{

    const response = await fetch("/api/jobs",{
      headers:{
        "x-admin-key":key
      }
    });

    if(!response.ok){

      statusBox.textContent =
        "❌ Wrong admin password.";

      jobsBox.innerHTML = "";

      return;
    }

    const jobs = await response.json();

    statusBox.textContent =
      "✅ Admin connected";

    jobsBox.innerHTML = "";

    if(!jobs.length){

      jobsBox.innerHTML =
        '<div class="card">📭 अभी कोई uploaded document नहीं है.</div>';

      return;
    }

    jobs.forEach(job => {

      const card = document.createElement("div");
      card.className = "card";

      const date =
        new Date(job.createdAt).toLocaleString("en-IN");

      let filesHTML = "";

      job.files.forEach(file => {

        filesHTML += `
          <div class="file">
            📄 ${escapeHTML(file.originalName)}
            <br>
            <a
              class="download"
              href="/api/file/${file.id}"
              target="_blank"
              onclick="downloadFile(event,'${file.id}')"
            >
              ⬇️ Download
            </a>
          </div>
        `;

      });

      card.innerHTML = `

        <h3>👤 ${escapeHTML(job.name)}</h3>

        <div class="small">
          Mobile last 4 digits: ${escapeHTML(job.last4)}
        </div>

        <div class="small">
          Uploaded: ${date}
        </div>

        <hr>

        ${filesHTML}

        <button
          class="delete"
          onclick="deleteJob('${job.id}')"
        >
          🗑️ Delete
        </button>

      `;

      jobsBox.appendChild(card);

    });

  }catch(error){

    statusBox.textContent =
      "❌ Server connection error.";

  }

}

async function downloadFile(event,id){

  event.preventDefault();

  const key = keyInput.value.trim();

  try{

    const response = await fetch("/api/file/"+id,{
      headers:{
        "x-admin-key":key
      }
    });

    if(!response.ok){
      alert("File download नहीं हो पाया.");
      return;
    }

    const blob = await response.blob();

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

  }catch(error){

    alert("Download error.");

  }

}

async function deleteJob(id){

  if(!confirm("क्या यह पूरा document record delete करना है?")){
    return;
  }

  const key = keyInput.value.trim();

  try{

    const response = await fetch("/api/job/"+id,{
      method:"DELETE",
      headers:{
        "x-admin-key":key
      }
    });

    if(!response.ok){

      alert("Delete नहीं हुआ.");
      return;

    }

    loadJobs();

  }catch(error){

    alert("Delete error.");

  }

}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
