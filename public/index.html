<!DOCTYPE html>
<html lang="en">
<head>

<meta name="google-site-verification" content="t4r2bEtLrgrWZTG7sAva4zlqm3hUoJzfeddefrIEYLQ">

<title>Shad Sheikh Digital | Online Document & Digital Services</title>

<meta name="description" content="Shad Sheikh Digital - Online document upload, printing and digital services. Upload your documents easily and securely.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef6ff,#ffffff);
  color:#172033;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:25px 15px 40px;
}

.header{
  text-align:center;
  padding:30px 10px;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  margin:16px 0 8px;
  font-size:32px;
}

.subtitle{
  color:#667085;
  font-size:16px;
}

.owner{
  margin-top:10px;
  font-weight:bold;
  color:#1264d8;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:25px;
}

.btn{
  display:block;
  padding:15px;
  border:0;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.public{
  background:#1264d8;
  color:white;
}

.admin{
  background:#172033;
  color:white;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px #00000012;
}

.file-box{
  margin-top:20px;
  padding:25px 15px;
  border:2px dashed #1264d8;
  border-radius:15px;
  text-align:center;
  background:#f8fbff;
}

.file-box input{
  width:100%;
  font-size:15px;
}

.upload{
  width:100%;
  margin-top:18px;
  background:#1264d8;
  color:white;
}

.note{
  text-align:center;
  color:#667085;
  font-size:13px;
  margin-top:12px;
}

#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

@media(max-width:600px){

  h1{
    font-size:26px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

}
</style>

</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="logo">
      <img src="/Dppp.jpg" alt="Shad Sheikh">
    </div>

    <h1>Shad Sheikh Digital</h1>

    <div class="subtitle">
      Digital Document & Online Services
    </div>

    <div class="owner">
      Owner: Shad Sheikh
    </div>

    <div class="buttons">

      <a class="btn public" href="#upload">
        📄 Public Document
      </a>

      <a class="btn admin" href="/admin.html">
        🔐 Shad Sheikh Admin
      </a>

    </div>

  </div>

  <div class="card" id="upload">

    <h2>📄 Document Upload</h2>

    <p>
      Apna document select karke Send button dabayein.
    </p>

    <form id="form">

      <div class="file-box">

        <strong>📁 Document Select Karein</strong>

        <br><br>

        <input
          id="files"
          type="file"
          multiple
          accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"
          required
        >

      </div>

      <button class="btn upload" type="submit">
        📤 Send Document
      </button>

    </form>

    <div class="note">
      Maximum 20 MB per file • PDF, JPG, PNG, WEBP, DOC, DOCX
    </div>

    <div id="msg"></div>

  </div>

</div>

<script>

const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const files = document.getElementById("files").files;

  if(!files.length){
    msg.textContent = "❌ Document select karein.";
    return;
  }

  const fd = new FormData();

  for(const file of files){
    fd.append("documents", file);
  }

  msg.textContent = "⏳ Document send ho raha hai...";

  try{

    const r = await fetch("/api/upload",{
      method:"POST",
      body:fd
    });

    const data = await r.json();

    if(!r.ok){
      msg.textContent = "❌ " + (data.error || "Upload failed");
      return;
    }

    msg.textContent = "✅ Document successfully send ho gaya.";

    form.reset();

  }catch(error){

    msg.textContent = "❌ Server se connection nahi ho paaya.";

  }

});

</script>

</body>
</html>
