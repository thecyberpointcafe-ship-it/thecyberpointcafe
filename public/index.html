<title>Shad Sheikh Digital | Online Document & Digital Services</title>
<meta name="description" content="Shad Sheikh Digital - Online document upload, printing and digital services. Upload your documents easily and securely.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef6ff,#ffffff);
  color:#172033;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:25px 15px 40px;
}

.header{
  text-align:center;
  padding:30px 10px;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  margin:16px 0 8px;
  font-size:32px;
}

.subtitle{
  color:#667085;
  font-size:16px;
}

.owner{
  margin-top:10px;
  font-weight:bold;
  color:#1264d8;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:25px;
}

.btn{
  display:block;
  padding:15px;
  border:0;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.public{
  background:#1264d8;
  color:white;
}

.admin{
  background:#172033;
  color:white;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px #00000012;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:15px;
}

.upload{
  width:100%;
  margin-top:18px;
  background:#1264d8;
  color:white;
}

.note{
  text-align:center;
  color:#667085;
  font-size:13px;
  margin-top:12px;
}

#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

@media(max-width:600px){
  h1{font-size:26px}
  .buttons{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

   <div class="logo">
  <img src="/Dppp.jpg" alt="Shad Sheikh">
</div>

    <h1>Shad Sheikh Digital</h1>

    <div class="subtitle">
      Digital Document & Online Services
    </div>

    <div class="owner">
      Owner: Shad Sheikh
    </div>

    <div class="buttons">

      <a class="btn public" href="#upload">
        📄 Public Document
      </a>

      <a class="btn admin" href="/admin.html">
        🔐 Shad Sheikh Admin
      </a>

    </div>

  </div>

  <div class="card" id="upload">

    <h2>📄 Public Document Upload</h2>

    <p>
      Apna document upload karne ke liye neeche details bharen.
    </p>

    <form id="form">

      <label>Name</label>

      <input
        id="name"
        type="text"
        placeholder="Apna naam likhen"
        required
      >

      <label>Mobile ke last 4 digits</label>

      <input
        id="mobileLast4"
        type="text"
        maxlength="4"
        inputmode="numeric"
        placeholder="Example: 1234"
        required
      >

      <label>Document select karein</label>

      <input
        id="files"
        type="file"
        multiple
        accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"
        required
      >

      <button class="btn upload" type="submit">
        📤 Upload Document
      </button>

    </form>

    <div class="note">
      Maximum 20 MB per file • PDF, JPG, PNG, WEBP, DOC, DOCX
    </div>

    <div id="msg"></div>

  </div>

</div>

<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const mobileLast4 = document.getElementById("mobileLast4").value.trim();
  const files = document.getElementById("files").files;

  if (!/^\d{4}$/.test(mobileLast4)) {
    msg.textContent = "❌ Mobile ke sirf last 4 digits daalein.";
    return;
  }

  if (!files.length) {
    msg.textContent = "❌ Document select karein.";
    return;
  }

  const fd = new FormData();

  fd.append("name", name);
  fd.append("last4", mobileLast4);

  for (const file of files) {
    fd.append("documents", file);
  }

  msg.textContent = "⏳ Upload ho raha hai...";

  try {
    const r = await fetch("/api/upload", {
      method: "POST",
      body: fd
    });

    const data = await r.json();

    if (!r.ok) {
      msg.textContent = "❌ " + (data.error || "Upload failed");
      return;
    }

    msg.textContent = "✅ Document successfully upload ho gaya.";
    form.reset();

  } catch (error) {
    msg.textContent = "❌ Server se connection nahi ho paaya.";
  }
});
</script>

</body>
</html>
