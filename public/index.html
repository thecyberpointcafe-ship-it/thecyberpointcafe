<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Document Upload</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}
.wrap{max-width:620px;margin:35px auto;padding:18px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 25px #0001}
h1{margin-top:0}.muted{color:#666}.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;cursor:pointer}
input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}
.success{padding:14px;background:#e9f8ed;border-radius:10px;display:none;margin-top:15px}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>📄 Café Document Upload</h1>
<p class="muted">Print निकलवाने के लिए अपनी PDF या photo यहाँ upload करें.</p>
<form id="form">
<label>आपका नाम</label><input name="name" required maxlength="80" placeholder="जैसे Rahul Kumar">
<label>Mobile के आखिरी 4 अंक</label><input name="last4" inputmode="numeric" maxlength="4" required placeholder="1234">
<label>Document (अधिकतम 10 files, प्रत्येक 20 MB)</label><input name="documents" type="file" multiple required accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx">
<button class="btn">Upload करें</button>
</form><div id="msg" class="success"></div>
</div></div>
<script>
form.onsubmit=async e=>{
 e.preventDefault(); const btn=form.querySelector("button"); btn.disabled=true; btn.textContent="Uploading...";
 const r=await fetch("/api/upload",{method:"POST",body:new FormData(form)}); const d=await r.json();
 msg.style.display="block"; msg.textContent=r.ok?"✅ Document upload हो गया। अब counter पर अपना नाम बताइए।":"❌ "+(d.error||"Upload failed");
 if(r.ok) form.reset(); btn.disabled=false; btn.textContent="Upload करें";
};
</script></body></html>
