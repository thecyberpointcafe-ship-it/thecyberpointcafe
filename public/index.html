<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="google-site-verification"
content="t4r2bEtLrgrWZTG7sAva4zlqm3hUoJzfeddefrIEYLQ">

<title>Shad Sheikh Digital | Online Document Services</title>

<meta name="description"
content="Shad Sheikh Digital - Easy online document upload and digital services.">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8ff;
  color:#172033;
}

.wrap{
  max-width:650px;
  margin:auto;
  padding:12px 12px 30px;
}

.header{
  text-align:center;
  padding:12px 5px 18px;
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  margin:11px 0 5px;
  font-size:27px;
}

.subtitle{
  color:#667085;
  font-size:14px;
}

.owner{
  margin-top:7px;
  font-weight:bold;
  color:#1264d8;
  font-size:14px;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.btn{
  flex:1;
  display:block;
  padding:13px 8px;
  border:0;
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.public{
  background:#1264d8;
  color:white;
}

.admin{
  background:#172033;
  color:white;
}

.card{
  background:white;
  border-radius:16px;
  padding:17px;
  box-shadow:0 5px 20px #0000000d;
}

.card h2{
  margin:0 0 6px;
  font-size:21px;
}

.card p{
  margin:0;
  color:#667085;
  font-size:14px;
}

.file-box{
  display:block;
  width:100%;
  margin-top:17px;
  padding:27px 10px;
  border:2px dashed #1264d8;
  border-radius:14px;
  text-align:center;
  background:#f8fbff;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.file-box:active{
  background:#eef6ff;
  transform:scale(.99);
}

.file-box strong{
  display:block;
  font-size:17px;
  color:#1264d8;
}

.file-box span{
  display:block;
  margin-top:7px;
  color:#667085;
  font-size:13px;
}

#files{
  display:none;
}

.upload{
  width:100%;
  margin-top:12px;
  background:#1264d8;
  color:white;
  font-size:16px;
}

.upload:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.selected{
  display:none;
  margin-top:9px;
  padding:9px;
  border-radius:8px;
  background:#f2f5f9;
  color:#475467;
  font-size:13px;
  word-break:break-word;
}

.progress-wrap{
  display:none;
  margin-top:12px;
}

.progress{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#1264d8;
  transition:width .1s linear;
}

.progress-text{
  text-align:center;
  margin-top:6px;
  font-size:13px;
  color:#667085;
}

.note{
  text-align:center;
  color:#667085;
  font-size:12px;
  margin-top:9px;
}

#msg{
  text-align:center;
  margin-top:12px;
  font-weight:bold;
  font-size:14px;
}

@media(max-width:600px){

  h1{
    font-size:24px;
  }

  .card{
    padding:15px;
  }

  .file-box{
    padding:28px 8px;
  }

}

</style>

</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="logo">
      <img src="/Dppp.jpg" alt="Shad Sheikh">
    </div>

    <h1>Shad Sheikh Digital</h1>

    <div class="subtitle">
      Digital Document & Online Services
    </div>

    <div class="owner">
      Owner: Shad Sheikh
    </div>

    <div class="buttons">

      <a class="btn public" href="#upload">
        📄 Document
      </a>

      <a class="btn admin" href="/admin.html">
        🔐 Admin
      </a>

    </div>

  </div>


  <div class="card" id="upload">

    <h2>📄 Document Send</h2>

    <p>
      Document select karein aur Send dabayein.
    </p>


    <form id="form">

      <label class="file-box" for="files">

        <strong>📁 Document Select</strong>

        <span>
          Yahan kahin bhi tap karke document select karein
        </span>

        <input
          id="files"
          type="file"
          multiple
          accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx"
        >

      </label>


      <div
        id="selected"
        class="selected">
      </div>


      <div
        id="progressWrap"
        class="progress-wrap">

        <div class="progress">

          <div
            id="progressBar"
            class="progress-bar">
          </div>

        </div>

        <div
          id="progressText"
          class="progress-text">
          0%
        </div>

      </div>


      <button
        id="sendBtn"
        class="btn upload"
        type="submit">

        📤 Send

      </button>

    </form>


    <div class="note">
      PDF, JPG, PNG, WEBP, DOC, DOCX • Maximum 20 MB per file
    </div>


    <div id="msg"></div>

  </div>

</div>


<script>

const form =
  document.getElementById("form");

const filesInput =
  document.getElementById("files");

const selected =
  document.getElementById("selected");

const sendBtn =
  document.getElementById("sendBtn");

const msg =
  document.getElementById("msg");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");


/* =========================
   FILE SELECT
========================= */

filesInput.addEventListener(
  "change",
  function(){

    const files =
      this.files;

    if(!files.length){

      selected.style.display =
        "none";

      selected.textContent =
        "";

      return;
    }


    if(files.length === 1){

      selected.textContent =
        "📎 " + files[0].name;

    }else{

      selected.textContent =
        "📎 " +
        files.length +
        " documents selected";

    }


    selected.style.display =
      "block";

  }
);


/* =========================
   FAST UPLOAD
========================= */

form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();


    const files =
      filesInput.files;


    if(!files.length){

      msg.textContent =
        "❌ Pehle document select karein.";

      return;
    }


    /* SIZE CHECK */

    for(const file of files){

      if(
        file.size >
        20 * 1024 * 1024
      ){

        msg.textContent =
          "❌ " +
          file.name +
          " 20 MB se bada hai.";

        return;
      }

    }


    /* FORM DATA */

    const fd =
      new FormData();


    for(
      const file of files
    ){

      fd.append(
        "documents",
        file
      );

    }


    /* UI */

    sendBtn.disabled =
      true;

    progressWrap.style.display =
      "block";

    progressBar.style.width =
      "0%";

    progressText.textContent =
      "0%";

    msg.textContent =
      "⏳ Document send ho raha hai...";


    /* XHR */

    const xhr =
      new XMLHttpRequest();


    xhr.open(
      "POST",
      "/api/upload",
      true
    );


    /*
      UPLOAD PROGRESS
    */

    xhr.upload.onprogress =
      function(event){

        if(
          event.lengthComputable
        ){

          const percent =
            Math.round(
              (
                event.loaded /
                event.total
              ) * 100
            );


          progressBar.style.width =
            percent + "%";


          progressText.textContent =
            "Sending... " +
            percent +
            "%";

        }

      };


    /*
      SUCCESS
    */

    xhr.onload =
      function(){

        sendBtn.disabled =
          false;


        progressBar.style.width =
          "100%";


        if(
          xhr.status >= 200 &&
          xhr.status < 300
        ){

          msg.textContent =
            "✅ Document successfully send ho gaya.";

          progressText.textContent =
            "100%";


          form.reset();


          selected.style.display =
            "none";

          selected.textContent =
            "";


          setTimeout(
            function(){

              progressWrap.style.display =
                "none";

              progressBar.style.width =
                "0%";

              progressText.textContent =
                "0%";

            },
            1500
          );


        }else{

          let errorMessage =
            "Upload failed";

          try{

            const data =
              JSON.parse(
                xhr.responseText
              );

            if(data.error){

              errorMessage =
                data.error;

            }

          }catch(error){}


          msg.textContent =
            "❌ " +
            errorMessage;


          progressText.textContent =
            "Upload failed";

        }

      };


    /*
      CONNECTION ERROR
    */

    xhr.onerror =
      function(){

        sendBtn.disabled =
          false;

        msg.textContent =
          "❌ Server se connection nahi ho paaya.";

        progressText.textContent =
          "Connection error";

      };


    /*
      CANCEL / TIMEOUT
    */

    xhr.onabort =
      function(){

        sendBtn.disabled =
          false;

        msg.textContent =
          "❌ Upload cancel ho gaya.";

      };


    /*
      SEND
    */

    xhr.send(fd);

  }
);

</script>

</body>
</html>
